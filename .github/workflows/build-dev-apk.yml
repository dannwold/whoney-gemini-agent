name: Build Developer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Generate build summary
        run: |
          echo "## ✅ Developer APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**APK Location:** app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "**Build Type:** Debug" >> $GITHUB_STEP_SUMMARY
          echo "**Retention Period:** 30 days" >> $GITHUB_STEP_SUMMARY
